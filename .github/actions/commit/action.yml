name: commit-data
description: Commit data/ and site/ changes with rebase-retry
inputs:
  message: { required: true }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        git config user.name "matchup-bot"
        git config user.email "matchup-bot@users.noreply.github.com"
        git add -A data
        if [ -d site ]; then git add -A site; fi
        if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
        git commit -m "${{ inputs.message }}"
        for i in 1 2 3 4 5; do
          git fetch origin main
          if git rebase -X theirs origin/main; then
            git push origin HEAD:main && exit 0
          else
            echo "rebase conflict; resolving in favor of this job's files"
            git diff --name-only --diff-filter=U | xargs -r git checkout --theirs --
            git add -A
            GIT_EDITOR=true git rebase --continue || git rebase --abort
          fi
          echo "push race, retry $i"; sleep $((i*7))
        done
        exit 1
