name: AI analysis
on:
  schedule:
    - cron: "30 12 * * *"        # 07:30 CT daily after market (07:20)
    - cron: "0 22 * * 3,5"        # Wed/Fri evening refresh: injuries and lines have moved
  workflow_dispatch:
    inputs:
      league: { description: "NFL, CFB, or BOTH", default: "BOTH", required: true }
      limit:  { description: "max games to generate this run", default: "120", required: false }
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Generate (hash-gated)
        run: |
          L="${{ github.event.inputs.league }}"; [ -z "$L" ] && L=BOTH
          LIM="${{ github.event.inputs.limit }}"; [ -z "$LIM" ] && LIM=120
          if [ "$L" = "NFL" ] || [ "$L" = "BOTH" ]; then python -m pipeline.jobs.build_ai --league NFL --limit $LIM --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}; fi
          if [ "$L" = "CFB" ] || [ "$L" = "BOTH" ]; then python -m pipeline.jobs.build_ai --league CFB --limit $LIM --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}; fi
      - name: Sample
        run: |
          F=$(ls -t data/tables/model/ai_analyses/*/*/*.json 2>/dev/null | head -1)
          if [ -n "$F" ]; then echo "=== $F"; python -c "import json,sys; d=json.load(open('$F')); print('model:', d['llm_model'], '| validation_failed:', d['validation_failed'], '| violations:', d['validation'].get('violations')); s=d['sections'] or {}; [print(f'\n[{k}]\n{v}') for k,v in s.items()]"; fi
      - uses: ./.github/actions/commit
        with: { message: "data: ai ${{ github.run_id }}" }
