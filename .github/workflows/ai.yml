name: AI analysis
on:
  schedule:
    - cron: "30 12 * * *"
    - cron: "0 22 * * 3,5"
  workflow_dispatch:
    inputs:
      league: { description: "NFL, CFB, or BOTH", default: "BOTH", required: true }
      limit:  { description: "max games per league this run", default: "120", required: false }
concurrency: { group: ai, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: NFL (generate + save)
        if: ${{ github.event.inputs.league == 'NFL' || github.event.inputs.league == 'BOTH' || github.event.inputs.league == '' }}
        run: python -m pipeline.jobs.build_ai --league NFL --limit ${{ github.event.inputs.limit || 120 }} --workers 4 --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      - uses: ./.github/actions/commit
        if: ${{ github.event.inputs.league == 'NFL' || github.event.inputs.league == 'BOTH' || github.event.inputs.league == '' }}
        with: { message: "data: ai NFL ${{ github.run_id }}" }
      - name: CFB (generate + save)
        if: ${{ github.event.inputs.league == 'CFB' || github.event.inputs.league == 'BOTH' || github.event.inputs.league == '' }}
        run: python -m pipeline.jobs.build_ai --league CFB --limit ${{ github.event.inputs.limit || 120 }} --workers 4 --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      - uses: ./.github/actions/commit
        if: ${{ github.event.inputs.league == 'CFB' || github.event.inputs.league == 'BOTH' || github.event.inputs.league == '' }}
        with: { message: "data: ai CFB ${{ github.run_id }}" }
