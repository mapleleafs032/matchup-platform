name: Market analysis
on:
  schedule:
    - cron: "20 12 * * *"        # 07:20 CT daily after predictions
    - cron: "45 * * * 4,5,6,0,1"  # Thu-Mon: every hour at :45 (after the odds snapshots)
  workflow_dispatch:
    inputs:
      league: { description: "NFL, CFB, or BOTH", default: "BOTH", required: true }
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Market engine
        run: |
          L="${{ github.event.inputs.league }}"; [ -z "$L" ] && L=BOTH
          if [ "$L" = "NFL" ] || [ "$L" = "BOTH" ]; then python -m pipeline.jobs.build_market --league NFL --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}; fi
          if [ "$L" = "CFB" ] || [ "$L" = "BOTH" ]; then python -m pipeline.jobs.build_market --league CFB --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}; fi
      - uses: ./.github/actions/commit
        with: { message: "data: market ${{ github.run_id }}" }
