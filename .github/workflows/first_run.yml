name: First run (CFB seed + verification)
on:
  workflow_dispatch:
    inputs:
      cfb_weeks: { description: "CFB weeks to load (space separated)", default: "0 1 2", required: true }
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  first-run:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_PLAN: ${{ vars.ODDS_PLAN || 'free' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q -m "not live"
      - name: NFL schedules 2026
        run: python -m pipeline.jobs.ingest_schedules --league NFL --trigger manual
      - name: CFB seed teams + schedules (prints VERIFY checklist)
        run: python -m pipeline.jobs.ingest_schedules --league CFB --weeks ${{ github.event.inputs.cfb_weeks }} --verify --trigger manual
      - name: First odds snapshot NFL (3 credits)
        run: python -m pipeline.jobs.ingest_odds --league NFL --trigger manual --force
      - name: First odds snapshot CFB (1 CFBD call)
        run: python -m pipeline.jobs.ingest_odds --league CFB --trigger manual --force
      - name: Summary
        run: python -m pipeline.jobs.report_status
      - uses: ./.github/actions/commit
        with: { message: "data: first run ${{ github.run_id }}" }
