name: Apply code bundle
on:
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: data-write, cancel-in-progress: false }
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the zip at the repo root into the repo
        run: |
          set -e
          N=$(ls -1 *.zip 2>/dev/null | wc -l)
          if [ "$N" = "0" ]; then echo "No .zip file at the repo root. Upload the bundle zip first."; exit 1; fi
          if [ "$N" != "1" ]; then echo "More than one zip at the root:"; ls -1 *.zip; echo "Delete the old ones so exactly one remains."; exit 1; fi
          Z=$(ls -1 *.zip)
          echo "Applying $Z"
          rm -rf /tmp/bundle && mkdir -p /tmp/bundle && unzip -q -o "$Z" -d /tmp/bundle
          SRC=/tmp/bundle
          if [ "$(ls -1 /tmp/bundle | wc -l)" = "1" ] && [ -d "/tmp/bundle/$(ls -1 /tmp/bundle)" ]; then SRC="/tmp/bundle/$(ls -1 /tmp/bundle)"; fi
          rsync -a --exclude '__pycache__' "$SRC"/ ./
          rm -f "$Z"
          rm -f test_*.py
          grep -q "SITE_DIR" config.py && echo "config.py: Phase 11+ confirmed" || echo "config.py: WARNING, older than Phase 11"
          git config user.name "matchup-bot"; git config user.email "matchup-bot@users.noreply.github.com"
          git add -A
          git commit -m "code: apply $Z" || echo "nothing to commit"
          git push origin HEAD:main
      - name: Show what changed
        run: git show --stat HEAD | head -40
