name: AI Picks (generate + grade)
on:
  schedule:
    - cron: "35 12 * * *"          # 07:35 CT daily, after AI (07:30) and before site (07:40)
    - cron: "50 * * * 4,5,6,0,1"    # Thu-Mon hourly at :50, after odds/splits/market refresh
  workflow_dispatch:
    inputs:
      league: { description: "NFL, CFB, or BOTH", default: "BOTH", required: true }
      weeks:  { description: "optional week list (blank = current + next)", default: "", required: false }
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Build and grade picks
        run: python -m pipeline.jobs.build_picks --league ${{ github.event.inputs.league || 'BOTH' }} ${{ github.event.inputs.weeks != '' && format('--weeks {0}', github.event.inputs.weeks) || '' }} --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      - uses: ./.github/actions/commit
        with: { message: "data: picks ${{ github.run_id }}" }
