name: Betting splits (ingest)
on:
  schedule:
    - cron: "5 12 * * *"
    - cron: "5 * * * *"
    - cron: "0,15,30,45 13-23 * * 0,4,6"
    - cron: "0,15,30,45 0-4 * * 1,5,0"
  workflow_dispatch:
    inputs:
      league:  { description: "NFL, CFB, or BOTH", default: "BOTH", required: true }
      dry_run: { description: "parse and report only (true/false)", default: "false", required: false }
      explain: { description: "print what the source published for games matching this team (blank = normal run)", default: "", required: false }
concurrency: { group: splits, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  splits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Ingest splits
        run: python -m pipeline.jobs.ingest_splits --league ${{ github.event.inputs.league || 'BOTH' }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} ${{ github.event.inputs.explain != '' && format('--explain {0}', github.event.inputs.explain) || '' }} --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      - uses: ./.github/actions/commit
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.explain == '' }}
        with: { message: "data: splits ${{ github.run_id }}" }
