name: Betting splits (ingest)
on:
  schedule:
    - cron: "5 12 * * *"          # 07:05 CT daily, before market (07:20) and site (07:40)
    - cron: "5 */3 * * 4,5,6,0"   # Thu-Sun: every 3 hours, picks up any new paste
  workflow_dispatch:
    inputs:
      league:  { description: "NFL, CFB, or BOTH", default: "BOTH", required: true }
      dry_run: { description: "parse and report only (true/false)", default: "false", required: false }
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  splits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Ingest splits
        run: python -m pipeline.jobs.ingest_splits --league ${{ github.event.inputs.league || 'BOTH' }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      - uses: ./.github/actions/commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        with: { message: "data: splits ${{ github.run_id }}" }
