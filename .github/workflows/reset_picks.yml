name: Reset picks record
on:
  workflow_dispatch:
    inputs:
      league:  { description: "NFL, CFB, or BOTH", default: "BOTH", required: true }
      season:  { description: "season (blank = current)", default: "", required: false }
      confirm: { description: "type RESET to actually clear the record; anything else only reports", default: "", required: true }
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Reset (or report)
        run: |
          python -m pipeline.jobs.reset_picks_record \
            --league ${{ github.event.inputs.league }} \
            ${{ github.event.inputs.season != '' && format('--season {0}', github.event.inputs.season) || '' }} \
            ${{ github.event.inputs.confirm == 'RESET' && '--confirm' || '' }}
      - uses: ./.github/actions/commit
        if: ${{ github.event.inputs.confirm == 'RESET' }}
        with: { message: "model: reset picks record ${{ github.run_id }}" }
