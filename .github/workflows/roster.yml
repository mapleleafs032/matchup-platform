name: Roster engine
on:
  schedule:
    - cron: "15 11 * * 2"        # Tuesdays 06:15 CT: refresh usage + re-derive (QB status / depth / continuity)
  workflow_dispatch:
    inputs:
      league: { description: "NFL, CFB, or BOTH", default: "BOTH", required: true }
      season: { description: "season (blank = current)", default: "", required: false }
      what:   { description: "fetch derive | fetch | derive | usage derive", default: "fetch derive", required: true }
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  roster:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: NFL
        if: ${{ github.event.inputs.league == 'NFL' || github.event.inputs.league == 'BOTH' || github.event.inputs.league == '' }}
        run: |
          W="${{ github.event.inputs.what }}"; [ "${{ github.event_name }}" = "schedule" ] && W="derive"
          python -m pipeline.jobs.build_roster --league NFL ${{ github.event.inputs.season != '' && format('--season {0}', github.event.inputs.season) || '' }} --what $W --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      - name: CFB
        if: ${{ github.event.inputs.league == 'CFB' || github.event.inputs.league == 'BOTH' || github.event.inputs.league == '' }}
        run: |
          W="${{ github.event.inputs.what }}"; [ "${{ github.event_name }}" = "schedule" ] && W="usage derive"
          python -m pipeline.jobs.build_roster --league CFB ${{ github.event.inputs.season != '' && format('--season {0}', github.event.inputs.season) || '' }} --what $W --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      - name: Summary
        run: python -m pipeline.jobs.report_status
      - uses: ./.github/actions/commit
        with: { message: "data: roster ${{ github.run_id }}" }
