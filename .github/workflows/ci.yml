name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Unit tests (fixtures only)
        run: pytest -q -m "not live"
      - name: Append-only immutability check
        if: github.event_name == 'pull_request'
        run: python -m pipeline.ci_immutability origin/${{ github.base_ref }} HEAD
