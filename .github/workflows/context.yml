name: Context (rosters, injuries, rankings, weather)
on:
  schedule:
    - cron: "0 11 * * *"          # 06:00 CT daily: everything
    - cron: "0 17,20,23 * * 4,5,6,0,1"   # Thu-Mon afternoons/evenings: injuries + weather refresh
  workflow_dispatch:
    inputs:
      league: { description: "NFL, CFB, or BOTH", default: "BOTH", required: true }
      what:   { description: "space-separated: all | players rosters injuries qbr rankings coaches venues manual weather", default: "all", required: true }
      season: { description: "season (blank = current)", default: "", required: false }
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Context ingestion
        run: |
          WHAT="${{ github.event.inputs.what }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(date -u +%H)" = "11" ]; then WHAT="all"; else WHAT="injuries weather manual"; fi
          fi
          python -m pipeline.jobs.ingest_context --league ${{ github.event.inputs.league || 'BOTH' }} \
            ${{ github.event.inputs.season != '' && format('--season {0}', github.event.inputs.season) || '' }} \
            --what $WHAT --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      - name: Summary
        run: python -m pipeline.jobs.report_status
      - uses: ./.github/actions/commit
        with: { message: "data: context ${{ github.run_id }}" }
