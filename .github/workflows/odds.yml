name: Odds snapshot
on:
  schedule:
    # Free-plan cadence (UTC). Midweek 2/day both leagues. Game-day hourly pulls come from the Apps Script
    # timer via workflow_dispatch, not from cron (GitHub cron is best-effort and can drift).
    - cron: "0 14 * * 1-6"      # 09:00 CT Mon-Sat
    - cron: "0 23 * * 1-6"      # 18:00 CT Mon-Sat
  workflow_dispatch:
    inputs:
      league: { description: "NFL, CFB, or BOTH", default: "BOTH", required: true }
      force:  { description: "ignore degrade threshold", default: "false", required: false }
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  odds:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_PLAN: ${{ vars.ODDS_PLAN || 'free' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: NFL
        if: ${{ github.event.inputs.league == 'NFL' || github.event.inputs.league == 'BOTH' || github.event.inputs.league == '' }}
        run: python -m pipeline.jobs.ingest_odds --league NFL --trigger ${{ github.event_name == 'schedule' && 'cron' || 'apps_script' }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: CFB
        if: ${{ github.event.inputs.league == 'CFB' || github.event.inputs.league == 'BOTH' || github.event.inputs.league == '' }}
        run: python -m pipeline.jobs.ingest_odds --league CFB --trigger ${{ github.event_name == 'schedule' && 'cron' || 'apps_script' }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - uses: ./.github/actions/commit
        with: { message: "data: odds ${{ github.run_id }}" }
