name: Stats (daily)
on:
  schedule:
    - cron: "30 10 * * *"       # 05:30 CT, after the schedules job
  workflow_dispatch:
    inputs:
      league:    { description: "NFL, CFB, or BOTH", default: "BOTH", required: true }
      season:    { description: "season (blank = current)", default: "", required: false }
      weeks:     { description: "weeks, space separated (blank = recent completed)", default: "", required: false }
      verify:    { description: "print CFBD schema report", default: "false", required: false }
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: NFL
        if: ${{ github.event.inputs.league == 'NFL' || github.event.inputs.league == 'BOTH' || github.event.inputs.league == '' }}
        run: |
          python -m pipeline.jobs.ingest_stats --league NFL \
            ${{ github.event.inputs.season != '' && format('--season {0}', github.event.inputs.season) || '' }} \
            ${{ github.event.inputs.weeks != '' && format('--weeks {0}', github.event.inputs.weeks) || '' }} \
            --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      - name: CFB
        if: ${{ github.event.inputs.league == 'CFB' || github.event.inputs.league == 'BOTH' || github.event.inputs.league == '' }}
        run: |
          python -m pipeline.jobs.ingest_stats --league CFB \
            ${{ github.event.inputs.season != '' && format('--season {0}', github.event.inputs.season) || '' }} \
            ${{ github.event.inputs.weeks != '' && format('--weeks {0}', github.event.inputs.weeks) || '' }} \
            ${{ github.event.inputs.verify == 'true' && '--verify' || '' }} \
            --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      - name: Summary
        run: python -m pipeline.jobs.report_status
      - uses: ./.github/actions/commit
        with: { message: "data: stats ${{ github.run_id }}" }
