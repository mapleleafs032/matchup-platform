name: Site (build + publish)
on:
  schedule:
    - cron: "40 12 * * *"        # 07:40 CT daily after AI (07:30)
    - cron: "55 * * * 4,5,6,0,1"  # Thu-Mon: every hour at :55 (after odds :00, lock :30, market :45)
  workflow_dispatch:
    inputs:
      weeks: { description: "optional week list to build (blank = previous, current, next)", default: "", required: false }
concurrency: { group: data-write, cancel-in-progress: false }
permissions: { contents: write, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Build site JSON
        run: python -m pipeline.jobs.build_site --league BOTH ${{ github.event.inputs.weeks != '' && format('--weeks {0}', github.event.inputs.weeks) || '' }} --trigger ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      - uses: ./.github/actions/commit
        with: { message: "site: build ${{ github.run_id }}" }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    permissions: { pages: write, id-token: write }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
