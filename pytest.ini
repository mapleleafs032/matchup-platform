[pytest]
# Only this project's tests. The repo also carries tests/unit/ and tests/integration/ from an earlier,
# abandoned project (package `edge`, SQLAlchemy/Postgres) whose imports cannot resolve here --
# requirements.txt installs pandas/pyarrow/duckdb, not sqlalchemy, and there is no `edge` package.
# Without this, pytest ABORTS THE WHOLE RUN on those five collection errors (exit 2) even though every
# real test passes, so CI failed on every push to main. Ignoring a path that does not exist is fine,
# so this keeps working once the stale directories are deleted.
testpaths = tests
addopts =
    --ignore=tests/unit
    --ignore=tests/integration
    --ignore=src
markers =
    live: tests that fetch public GitHub-hosted data (no keys)
