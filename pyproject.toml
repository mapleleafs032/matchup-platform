[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sports-edge"
version = "0.1.0"
description = "Sports prediction and betting-market analysis platform (personal, non-commercial use)."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.1,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "respx>=0.21,<1",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
edge = "edge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: needs a real PostgreSQL database (TEST_DATABASE_URL)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]   # autogenerated by Alembic

[tool.mypy]
python_version = "3.12"
packages = ["edge"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true
